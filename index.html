<header><div style="font-size:44px">🏠📚</div><h1>إدارة موارد الأسرة</h1><p>المنهج مقسم لفصول · اضغط على أي كارت لفتحه · ثم جرّب نفسك في الامتحانات</p></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const C=[
{t:'الفصل ١: موارد الأسرة',i:'🧩',s:[
['📌','مفهوم الموارد وأهميتها',['**موارد الأسرة** = كل الوسائل التي تملكها العائلة وتستخدمها لتحقيق أهدافها.','**الإدارة** = الفن الذكي لاستغلال هذه الموارد للوصول لأقصى استقرار وسعادة.']],
['👥','تقسيم الموارد (فئتان مترابطتان)',['**١) بشرية (ذاتية):** صعبة القياس وغالباً تُهمل — الطاقات (مجهود بدني وذهني) · الميول والقدرات (مواهب فطرية) · المهارات (براعة مكتسبة كالخياطة) · الاتجاهات (مواقف نفسية) · العلم والمعرفة.','**٢) غير بشرية (مادية/بيئية):** ملموسة وسهلة القياس — المال (الدخل والميزانية) · الممتلكات (عقارات، أثاث، أدوات) · الوقت (عامل حاسم) · تسهيلات المجتمع (مدارس، مستشفيات، حدائق).']],
['⚖️','الخصائص المشتركة للموارد',['**المحدودية:** الوقت 24 ساعة لا يُدخر · الطاقة تتأثر بالراحة · المال يزيد بالعمل أو الاقتراض · القدرات بالوراثة وتحتاج صقل.','**الترابط والإحلال:** إحلال وقت بدل مال (عمل يدوي) · مال بدل وقت (استئجار عاملة) · ممتلكات بدل جهد (غسالة أطباق).','**تعدد الاستعمالات:** المورد الواحد يُصرف في اتجاهات مختلفة والقرار الصحيح يوازن بينها.']],
['🍰','مفهوم الموازنة (مثال الكعكة)',['الموازنة ≠ تقسيم بالتساوي، بل التوزيع **حسب الحاجة**.','لو زاد مورد (الدهون) عُدّلت باقي الموارد فوراً · أي نقص/زيادة غير مدروسة تُفسد الهدف · لا يمكن حذف مورد أساسي.','المقياس الحقيقي لأهمية هدف = **ما تخصصه فعلاً** من وقت ومال وجهد.']],
['🧠','تفاصيل وأمثلة الموارد البشرية',['**الطاقات:** المجهود البدني والذهني · **الميول والقدرات:** مواهب فطرية (مثل الميل للميكانيكا) · **المهارات:** براعة مكتسبة (مثل خياطة الملابس) · **الاتجاهات:** مواقف نفسية وأفكار (مثل الموقف تجاه العمل المنزلي) · **العلم والمعرفة:** الحصيلة الثقافية (مثل الدراية بعلم التغذية).','الموارد البشرية والمادية **مترابطة ولا يمكن الفصل بينها** في الواقع، والبشرية تُهمل لصعوبة قياسها بالرقم أو الوقت.']],
['🔒','تفاصيل المحدودية والإحلال',['**الوقت:** 24 ساعة للجميع لا تزيد ولا تُدخر · **الطاقة:** محدودة وتتأثر بالراحة ولا تُضاعف بلا حدود · **المال:** محدد لكن يزيد بالعمل أو الاقتراض · **القدرات:** محكومة بالوراثة وتحتاج للصقل.','الموارد تعمل كنسيج واحد ويحل بعضها محل بعض: **إحلال وقت بدل مال** (القيام بالعمل يدوياً لتوفير المال) · **إحلال مال بدل وقت** (استئجار عاملة لتوفير وقت ربة المنزل) · **إحلال ممتلكات بدل جهد** (غسالة الأطباق توفر الجهد والوقت).']],
['🎯','تعدد الاستعمالات والموازنة (ملخص للمراجعة)',['المورد الواحد يُصرف في اتجاهات مختلفة، والقرار الصحيح **يوازن** بينها.','الموازنة تعني التوزيع حسب الحاجة وليس بالتساوي. مثال الكعكة: لصنع كعكة ناجحة نحتاج مقادير محددة (دقيق، سكر، دهون)؛ لو زاد مورد كالمادة الدهنية يجب تعديل بقية الموارد فوراً للحفاظ على التوازن، وأي نقص أو زيادة غير مدروسة تؤدي لخلل في المنتج النهائي (الهدف)، ولا يمكن حذف مورد أساسي وتوقع نتيجة سليمة.']]]},
{t:'الفصل ٢: عوامل تؤثر في استعمال الموارد',i:'🧭',s:[
['🔢','العوامل السبعة',['١ مستوى المعيشة · ٢ المستوى الاجتماعي والاقتصادي · ٣ دخل الأسرة · ٤ حجم الأسرة · ٥ الطور الذي تجتازه · ٦ اشتغال الزوجة · ٧ مكان السكن.','العوامل متداخلة (مثلاً الحجم مرتبط بالطور) وتُدرس منفصلة لفهم أثر كل واحد.']],
['🎚️','١) مستوى المعيشة',['**مستوى المعيشة** = الصورة العقلية لما يراه الفرد ضرورياً (الهدف). **المستوى الاستهلاكي** = ما يملكه ويستهلكه فعلاً. التقييم = مقارنة الاثنين.','**البسيط:** ليس فقراً؛ هو قرار واختيار وكفاية مادية وقناعة. فوائده: حرية شخصية · توافق مع الأديان · راحة نفسية وجمال · توفير وقت وجهد.','**المرتفع:** قيم معنوية سامية وسعادة حقيقية. **المنخفض:** حاجات بيولوجية فقط (سببه مالي أو ثقافي). **الباهظ:** هدر موارد وإسراف (الجهل بالموارد + اعتقاد أن الإسراف هو الوسيلة).']],
['🏛️','٢) المستوى الاجتماعي والاقتصادي',['قبل ثورة 23 يوليو 1952: طبقية، مصير بالوراثة، انعدام تكافؤ الفرص، جمود الطبقات.','بعدها: مساواة وتكافؤ فرص؛ السلطة داخل البيت تحولت من الأب المستبد إلى **التشاور** وتخطيط سليم ومصلحة عامة.']],
['💰','٣) دخل الأسرة',['**الدخل المباشر (بدون نقود):** إنتاج منزلي · خدمات ذاتية بين الأفراد · استغلال الممتلكات · خدمات مجتمعية عامة.','**غير المباشر (بمقابل):** سلع بالمال · خدمات مهنية وفنية وجسمانية · مقايضة الخدمات.','**المعنوي:** السعادة والرضا الناتجة عن الدخل الحقيقي (نسبي — مثال مصطفى ومحمد).','**الدخل الكلي = الدخل الحقيقي (مباشر + غير مباشر) + المال المتبقي.** المتبقي يذهب إلى: ادخار · هدايا · أعمال خير.','الدخل المالي = **القدرة الشرائية** لكمية النقود (مثال 1930 مقابل 1970).']],
['👨‍👩‍👧‍👦','٤) حجم الأسرة',['تكاليف **تزداد طردياً:** غذاء، ملبس، رعاية طبية، تعليم. تكاليف **شبه ثابتة:** سكن، أثاث، أدوات.','المشكلة السكانية: الدخل القومي لا يجاري النمو السكاني. أسباب الزيادة في مصر: فقر (مارشال وكايزر) · الأطفال كأيدٍ عاملة · الريف (٧٤٪ اتكالية، مناخ، فراغ) · زواج مبكر (٤٥٪ تحت 19) · الأطفال لربط الزوج · تعدد الزوجات.','العلاج: عيادات · زائرات صحيات وتعليم · دور رجال الدين · مسؤولية الفرد والأسرة.']],
['🔄','٥) الطور (دورة حياة الأسرة)',['التقسيم يحدد مسؤوليات كل طور ويحصر الموارد. الأسرتان المتماثلتان عدداً ودخلاً تختلفان إدارياً بسبب الطور.','**الأطوار السبعة:** ١ التكوين والاستقرار (مرحلة التخطيط) · ٢ الإنجاب (قيمة الوقت ذروتها) · ٣ المدرسة (استهلاك ملابس أعلى) · ٤ الثانوية (ميزانية غذاء أعلى) · ٥ الجامعة · ٦ استقلال الأبناء · ٧ العش الفارغ والشيخوخة (مصاريف طبية، دخل أقل).']],
['👩‍💼','٦) الزوجة العاملة',['فوائد: خدمة **الذات** والأسرة والوطن. دوافع: حاجة مادية · معاونة · اجتماعية واستقلال · شغل الفراغ.','الاتجاه المتفائل (الراجح): خبرة ومرونة · روح مشاركة · تقدير الموارد. قانون العمل المادة 139: حضانة لمن لديه 100 عاملة فأكثر.','دراسة سيراكيوز: العاملة 34.4 ساعة أسبوعياً مقابل 56.4 للمتفرغة بدون فرق في النظافة · لا فرق في ميزانية الغذاء (المتفرغات يصرفن ٢٠٪ أكثر) · تعاون الزوج أكبر.']],
['📍','٧) مكان السكن',['الحي يغير القيم والأولويات · الريف: أغلب السكان يملكون بيوتهم، تخطيط مرتبط بالمواسم، عمل المرأة أكبر · الصعيد: الأب سلطة مطلقة · المدينة: تعاون وموافقة مشتركة.']],
['🌍','تفاصيل مستوى المعيشة: ثلاثة مستويات',['**المستوى الاستهلاكي** هو ما يملكه الفرد أو يتمتع به فعلاً. المجتمع يضع الإطار العام (**جماعي**)، والفرد يختار ما يناسب قيمه وظروفه (**فردي**)، والنمط **العالمي** يوفر البساطة والتنقل بين بقاع العالم دون تغييرات جذرية في أسس المعيشة.','**البساطة ليست فقراً:** الفرق في نقطتين: (١) الوفرة المادية (البسيط يوفر الماديات الكافية والفقر لا يسمح باقتنائها) (٢) الإرادة والاختيار (البساطة قرار شخصي والفقر غالباً خارج عن الإرادة).','البساطة **حالة ذهنية** تعتمد على القناعة والرضا، وهي في عصرنا المادي أمر صعب يتطلب **عزماً وشجاعة** لتقديم الراحة الشخصية على تقاليد المجتمع.','البساطة في المنزل: إضاءة غير مباشرة بدل الثريات الضخمة، وقطع أثاث خفيفة وأنيقة بدل الضخمة المنقوشة. وفي المجتمع: ترتبط بالجدية في العمل وتوفير الوقت والجهد لما ينفع الجميع.']],
['📉','المستوى المنخفض والباهظ والتقييم',['**المرتفع:** قيم واحتياجات سامية (معنوية وراقية) تمنح شعوراً حقيقياً بالسعادة والرضا.','**المنخفض:** رغبات حول الحاجات الجسمية والبيولوجية فقط (أكل ونوم)، يفتقر للجمال والرقي والثقافة والأمن والهوايات، ويهمل الارتباطات الاجتماعية، وقد يتضمن رغبات ضارة. أسبابه: **مالي** (قلة الدخل) و**ثقافي** (الجهل بالقيم، فبدون وعي لا تتطور القيم حتى لو توفر المال).','**الباهظ الثمن:** يركز على **طريقة** الحصول على الأشياء أكثر من قيمتها، وسمته هدر الموارد (طاقة ومال ومجهود أكثر مما تتطلبه القيمة). أسبابه: الجهل بطبيعة الموارد وطرق استعمالها · الاعتقاد أن الإسراف هو الوسيلة الوحيدة لتحقيق الرغبات.','**التقييم:** الهدف الرغبة في الارتقاء، والطريقة المقارنة بين مستوى المعيشة والمستوى الاستهلاكي.']],
['🏰','قبل وبعد ثورة يوليو 1952',['**قبلها (الطبقية):** المصير بالوراثة (أرستقراطية، متوسطة، عامة الشعب) · انعدام تكافؤ الفرص (التعليم الجامعي والمناصب العليا حكر على الأغنياء، وحُرم أبناء الفلاحين والعمال) · جمود الطبقات وغياب العدالة.','**بعدها:** قامت لتحطيم الحواجز وتحقيق الديمقراطية. الأساس العلمي: الذكاء لا يقتصر على طبقة أو جنس. الأساس الديني: الإسلام سبق بالمساواة منذ 14 قرناً وقيمة الإنسان بعمله لا بنسبه و"الدين المعاملة". المساواة الحديثة: فرص متكافئة بغض النظر عن المستوى الاجتماعي أو الدين أو اللون.','**انعكاسه على الأسرة:** النواة الأولى لغرس الحرية والكرامة والاحترام بين الوالدين والأبناء · من الديكتاتورية إلى التشارك · موارد الأسرة بالتخطيط السليم والمصلحة العامة بدل الأنانية · تغير طرق تنفيذ الخطط مع تطور القيم.']],
['🧮','تفاصيل الدخل وأقسامه',['**التعريف:** مجموع السلع والخدمات المحدودة المتاحة لإشباع احتياجات الأفراد خلال مدة زمنية. أهم عامل يحدد استعمال الموارد، والإنسان يميل للواقعية فيضع مستوى معيشته في حدود قدرته المالية. الدخل الكلي لا يقتصر على النقدي.','**المباشر:** إنتاج منزلي (حديقة، دواجن مع خصم التكاليف) · خدمات ذاتية (الطهو والتنظيف والإصلاحات) · خدمات مجتمعية (مدارس، مستشفيات حكومية، حدائق، مكتبات، مساجد وكنائس، أمن ومطافئ، مواصلات) · استغلال الممتلكات الدائمة كالسكن المملوك.','**غير المباشر:** سلع (طعام، ملابس، سكن، سيارات) · خدمات تخصصية (كشف الطبيب) أو مهارة بسيطة (إصلاح صنابير) أو جهد جسماني (حمل حقائب) · **المقايضة** (سيدة تخيط فستاناً لجارتها مقابل دروس لابنها، أو تبادل كتب الطلاب).','**المعنوي:** نسبي، يختلف حسب مستوى المعيشة والتوقعات (مصطفى سعيد بضرورياته ومحمد بنفس الأشياء أقل سعادة).','**القدرة الشرائية هي المقياس:** مضاعفة الدخل ثلاث مرات بين 1930 و1970 لا تعني الغنى لأن قيمة الجنيه تغيرت. **أهمية الدخل الحقيقي:** يشمل الوقت وطاقات الأفراد وموارد المجتمع، ويعطي صورة أدق لمستوى المعيشة، وإن كان غير مقنن حسابياً.']],
['📈','أرقام المشكلة السكانية وحلولها',['عالمياً: من 919 مليون في القرن 19 إلى 2330 مليون في منتصف القرن 20. مصر: من 10 ملايين إلى أكثر من 30 مليوناً خلال نصف قرن.','**اقتصادياً:** علاقة طردية بين الفقر والمواليد (مارشال: الخصوبة أعلى لدى الأقل حظاً · كايزر: أعلى معدلات الإنجاب بين من يعتمدون على الإعانات) · الطفل "أيد عاملة" مجانية قبل دخول الآلة.','**اجتماعياً وبيئياً:** حوالي **74%** من السكان في مجتمعات زراعية · اتكالية (التوالد قدري) · الخصوبة أعلى في المناخ المعتدل المائل للحرارة · نقص الترفيه · تقديس الزواج · **أكثر من 45%** من الزيجات تحت 19 سنة (مقابل 8% في إنجلترا) · الاعتقاد أن الأطفال يمنعون الطلاق · تعدد الزوجات.','**المواجهة:** مهما زاد الدخل القومي لن يرتفع مستوى معيشة الفرد إن استمرت الزيادة · عيادات بأسعار في المتناول · الزائرات الصحيات في الريف · المناهج الثانوية والمعاهد العليا للبنات · رجال الدين يصححون المعتقد الخاطئ · إسهامات صغيرة من كل فرد · العدالة الاجتماعية (الكفاية والعدل والكرامة) · التوعية ثم الإدراك ثم السلوك والتنفيذ، وجوهره **الرغبة التلقائية**.']],
['🔁','تفاصيل أطوار الأسرة السبعة',['الدورة تبدأ من اليوم الأول وتتداخل أطوارها؛ التقسيم في الكتاب على المرحلة الدراسية للأبناء (7 مراحل). قد تُختصر بعض المراحل عند الاكتفاء بالتعليم الإلزامي أو زواج الأبناء مبكراً.','**١ التكوين:** تأثيث البيت بمشاركة الزوجين وقد تبدأ بديون وأقساط، والمصاريف الاستهلاكية أدنى ما يكون، وهي مرحلة التخطيط (فلسفة الإدارة والأهداف والقيم).','**٢ الإنجاب:** تكاليف أثاث وأدوات (غسالة، حجرة أطفال) وقد تحتاج سكناً أوسع ومساعدة خارجية، وقيمة الوقت في ذروتها ويتطلب تخطيطاً وادخاراً.','**٣ المدرسة:** أدوات مدرسية ولعب وعلاج طبي، **أعلى استهلاك ملابس**، رعاية دروس والتواصل مع مجلس الآباء والمعلمين.','**٤ الثانوية:** رغبة في التميز بالمظهر، وارتفاع ميزانية الغذاء بسبب شهية المراهقين.','**٥ الجامعة:** كتب وسكن للمغتربين ومواصلات ومصاريف شخصية، وتجربة أمريكا في عمل الطالب ليعول نفسه.','**٦ الاستقلال:** زواج الأبناء أو انتقالهم للعمل؛ إيجابي (مساعدتهم للوالدين) وأعباء (تجهيز البنات والأفراح).','**٧ العش الفارغ:** هدوء وسكينة (قصيرة نسبياً في مصر) · مصاريف طبية · قلة الدخل عند التقاعد · مشكلة سكن المسنين · أهمية الادخار السابق.','مثال: الأسرة (أ) زوجان في مقتبل العمر مع رضيع، والأسرة (ب) في الطور الرابع بسن المعاش مع ابن جامعي؛ مشاكلهما الإدارية مختلفة رغم تماثل العدد والدخل.']],
['🧕','تفاصيل الزوجة العاملة',['**تحول تاريخي:** رفض قديم خاصة في الشرق ثم صار ضرورة حضارية وتعليمية، والاختراعات الحديثة خففت العبء المنزلي، وثورة يوليو منحتها المساواة (أول وزيرة في تاريخ مصر).','**دوافع العمل الأربعة:** حاجة مادية · معاونة الزوج لمواجهة غلاء المعيشة منذ الحرب العالمية الثانية · دوافع اجتماعية واستقلال وكماليات (غالباً تترك العمل بعد الزواج) · شغل وقت الفراغ (غير متزوجة، بلا أطفال، أو العش الفارغ).','**الأثر العام:** نسبة العاملات 5.7% من النساء (نحو 400 ألف من 7 ملايين قوة عاملة). **الاتجاه المتخوف** يرى الفوضى وانحلال النظام الأسري، و**المتفائل (الراجح)** يرى خبرة ومرونة وروح مشاركة وتقدير الموارد.','**الضمانات:** منع الأعمال الضارة صحياً أو خلقياً · تحديد ساعات العمل ومقاعد للراحة · حق الاستقالة عند الزواج أو الطفل الأول · إجازة وضع بأجر كامل وفترات رضاعة · الحضانات (المادة 139، 100 عاملة فأكثر) وهي مركز إرشاد للآباء أيضاً.','**دراسة جامعة سيراكيوز:** العاملة 34.4 ساعة أسبوعياً مقابل 56.4 للمتفرغة · ميزانية الغذاء: 20% من أسر المتفرغات تصرف أكثر · تعاون الزوج أكبر · نصيب أقل جداً من حياكة الملابس · لا فرق في النشاط الاجتماعي (العاملة تميل لأنشطة مجال وظيفتها) · تطابق الأدوات المنزلية.','**التكيف يتطلب تغييراً على 3 مستويات:** العاملة (استعمال فعال للموارد) · الأسرة (تقدير الدور والمشاركة دون خجل) · المجتمع (تسهيلات مادية كالآلات وأدبية كالاحترام والتشجيع، فتمنح الأسرة دخلاً معنوياً).']],
['🏘️','تفاصيل مكان السكن',['**الحي والوسط:** تختلف القيم حتى داخل المدينة الواحدة (السيدة زينب: المباهاة بالحلي الذهبية، مصر الجديدة: ملابس فاخرة أهم) · أسرة المدينة تضحي بمتع لشراء أجهزة حديثة (ثلاجة، موقد) بينما يراها الريفيون تبذيراً · الجوار يفرض ضغوطاً اجتماعية ومستويات تتفق مع المحيط.','**ريف مقابل مدينة:** أغلب الريف يملك مساكنه · الريف أكثر إيماناً بالتخطيط لارتباط رزقه بالمواسم · نسبة عمل المرأة (الفلاحة) أكبر في الريف لمساعدة الزوج في الزراعة والتسويق.','**سلطة القرار:** الصعيد (الأب سلطة مطلقة لا تُناقش) · الريف (سلطة للمرأة أخف من الرجل) · المدينة (التعاون الاشتراكي والموافقة المشتركة مع مراعاة آراء الجميع).']]]},
{t:'الفصل ٣: إدارة الدخل المالي',i:'💵',s:[
['🧾','الميزانية وأسسها السبعة',['خطة لتوازن موارد محدودة مع احتياجات متعددة، وليست للمال فقط.','**١ ارتباط بالأهداف · ٢ ترتيب الأولويات · ٣ واقعية · ٤ مرونة · ٥ احتياط للطوارئ · ٦ تطوير لا حصر · ٧ الاعتراف بالقيود.**']],
['🪜','خطوات الميزانية الخمس',['١ حصر الاحتياجات · ٢ التقدير والتبويب · ٣ تقدير الدخل (الحد الأدنى المتوقع) · ٤ الموازنة (الدخل = المنصرف) · ٥ المراجعة (توازن، احتياط، رؤية، محيط).','البدء بالاحتياجات قبل الدخل = اتجاه نفسي سليم يعطي الأولوية للأفراد.','عجز الموازنة: **زيادة الدخل** (عمل إضافي، تبسيط، استثمار المهارات) أو **ضغط المصروفات** (الضروري فقط، جودة أقل، الخدمات المجانية).']],
['📒','دليل التنفيذ والمراقبة',['سجل 3 صفحات: **مصروفات ثابتة** (الإجمالي السنوي ÷ 12) · **دخل** · **صافي الدخل** (الدخل − الثوابت) ويشمل: غذاء، ملبس، تشغيل البيت، شخصية واجتماعية، طبيب.','المراقبة: مراجعة عقلية · **الأظرف** · كشوف الحساب · الفواتير. التعديل عند خطأ التقدير أو ظرف طارئ.']],
['🐖','الادخار',['**اختياري** (بإرادة الفرد) و**جبري** (ضرائب، معاشات، تأمينات).','عوامل شخصية: المزاج · التوقعات المستقبلية · الدخل (طردية) · سعر الفائدة · الإنفاق الحكومي · وضوح الأهداف.']],
['🔍','تفاصيل خطوات الميزانية',['**الخطوة ١:** التبويب تنظيم وتنسيق (غذاء، سكن، تعليم) يوضح أين تذهب الأموال.','**الخطوة ٢ (الأثمان):** الأسر الجديدة تدوّن المصاريف الفعلية عدة أسابيع، والمتمرنة تعتمد سجلات السنوات السابقة، وتُراعى زيادة التكاليف مع الإنجاب ونقصها عند زواج الأبناء.','**الخطوة ٣:** الدخل الثابت (مرتب، إيجار) دقيق، والمتغير (تجارة، عمولة، زراعة) تقريبي. **القاعدة الذهبية:** عدم التفاؤل المفرط وتقدير الحد الأدنى.','**الخطوة ٤:** زيادة الدخل = عمل إضافي · تقييم عمل الأم (قد يكون تفرغها أوفر لو تكاليف خروجها من حضانة وشغالة ومواصلات تقارب راتبها) · تبسيط المعيشة · استثمار المهارات المنزلية. ضغط المصروفات = الضروري فقط · كميات أقل أو جودة أقل · الخدمات العامة المجانية.','**الخطوة ٥:** المراجعة بأسئلة: التوازن · الاحتياط · الرؤية · المحيط (الحالة الاقتصادية للدولة).']],
['📑','تفاصيل الصفحات والفترة الزمنية',['الفترة: أسبوع أو شهر أو سنة. **السنوية الأكثر واقعية وشمولاً** وتُقسم لشهرية وأسبوعية. يُفضل سجل مسطر منفصل للميزانية عن سجل المصروفات اليومية.','**الثابتة:** إيجار، أقساط، مدارس، ضرائب، رخص، اشتراكات، وبند الطوارئ الإلزامي، وتُقسم على 12 لحجز المبلغ شهرياً.','**الدخل:** راتب، أرباح تجارة، إيراد عقارات، أسهم، مكافآت، أعمال إضافية، بدقة في الثابت وحذر في المتغير مع متوسط السنوات السابقة.','**صافي الدخل = إجمالي الدخل − المصروفات الثابتة.** الغذاء بمتوسط الاستهلاك الأسبوعي، والملبس بعد حساب الموجود فعلاً، والتشغيل والمواصلات (طاقة، مياه، مواد تنظيف، وقود)، والطبيب ما لا يغطيه التأمين.','التنفيذي: ميزانية شهرية بعد خصم الثوابت · سجل يومي · توزيع أسبوعي للمبتدئين.']],
['📊','تقييم استعمال النقود',['آخر خطوة إدارية: كشف العيوب والمزايا · التأكد من تحقيق الأهداف القريبة والبعيدة · **الدخل المعنوي** (الرضا الناتج عن تنفيذ الخطة) من أنجح وسائل التقييم.','أهمية الادخار: يفيد الفرد (يزيد دخله) والدولة (تنمية). توفير ٢٪ من الاستهلاك السنوي قد يوفر موارد استثمارية تعادل 26 مليون جنيه. تحويل المدخرات لسلع استثمارية يرفع الدخل القومي.','تفصيل العوامل الشخصية: **المزاج** (البخل مقابل عدم الادخار رغم الدخل الكبير) · **التوقعات** (توقع زيادة الدخل يقلل الادخار الحالي، وتوقع انقطاعه في الشيخوخة أو وجود أطفال يزيده) · **الدخل** (طردية لأن الضروريات لا تزيد بنفس النسبة) · **الفائدة** (من ٢٪ إلى ٣٪ يزيد الرغبة) · **الإنفاق الحكومي** (خدمات مجانية توفر مبالغ أكبر).']]]},
{t:'الفصل ٤: إدارة الوقت',i:'⏰',s:[
['⌛','خصائص الوقت',['٢٤ ساعة للجميع · **لا يُدخر ولا يُستبدل** · علاقة طردية مع الطاقة.','العوامل: نوع الأعمال · دورة حياة الأسرة · الفلسفة الشخصية. الحل: **سجل الوقت** لمعرفة أين يذهب.','**وحدة العمل (Work Unit):** عدد الدقائق المستهلكة في كل عمل منزلي خلال الأسبوع.']],
['🗓️','أنواع خطط الوقت وخطواتها',['**١ قائمة الأعمال** (للتذكر) · **٢ خطة المجموعات** (تركيز على النهاية) · **٣ الجدول الزمني** (الأدق: بداية ونهاية كل عمل).','خطوات الجدول: الحصر · التقدير · الموازنة · **وقت الطوارئ** · التدوين · التكيف.','الأعمال: يومية · أسبوعية · موسمية. ثم: تجزئة، تداخل أعمال، تدوين، تنفيذ ومراقبة (حاسة الوقت)، تقييم.']],
['✅','الوصايا الخمس عشرة',['برمجة مسبقة · التخلص من الزوائد · التبسيط · توقع الطوارئ · التطوير · تقليل المقتنيات · ترتيب استراتيجي · سهولة الوصول · صيانة فورية · مشاركة أسرية · تجميع المهام · سرعة متوازنة · تبسيط المطبخ · فترات راحة · الاهتمام بالصحة.']],
['🧮','عوامل استهلاك الوقت وسجل الأعمال',['قائمة الأعمال تختلف من أسرة لأخرى ويفصّل كل عمل بدقة، وتُملأ في نهاية الأسبوع وقد تتكرر أسابيع للوصول لمتوسط دقيق.','**٧ عوامل:** طبيعة العمل · مستوى الإتقان · الأدوات والخامات (المكنسة الكهربائية) · حجم وأعمار الأسرة · عمر ربة البيت · الخبرة · التعاون الأسري.']],
['📐','مبادئ التخطيط وإرشادات النجاح',['علاقة **عكسية:** كلما زاد وقت التخطيط قل الوقت الضائع. التخطيط لا يزيد ساعات اليوم بل يحسن استغلالها، ويراعي عادات الفرد (كالقراءة الصباحية).','المبتدئ يفصّل بالدقائق، والمتمرس يحدد وقتاً عاماً (ساعة لتنظيف الغرفة).','الإرشادات: **الأولويات · الميول والتسلسل · الإتقان · الترويح · المشاركة · المرونة.**']],
['🛠️','الدليل المتكامل (٨ خطوات)',['١ حصر وتصنيف (يومية: طعام، أطفال، نظافة · أسبوعية: تنظيف عميق، غسيل وكي، تسوق · موسمية: أعياد، تخزين ملابس، مربيات).','٢ تقدير الوقت بتجزئة العمل الكبير · ٣–٤ توزيع وموازنة (تنسيق المهام، مراعاة المحيطين كعدم الغسيل في إجازة الزوج، تقديم الثابت كالمدرسة، تداخل أعمال كالطهي أثناء غسل الأواني، وقت طوارئ).','٥ التدوين: ذهنياً للمتمرسات والخطط القصيرة، وكتابياً للمبتدئات · ٦ التكييف الجماعي · ٧ التنفيذ والمراقبة (التنشيط، المراجعة، **حاسة الوقت**) · ٨ التقييم قبل وأثناء وبعد التنفيذ.']]]},
{t:'الفصل ٥: إدارة الطاقة البشرية',i:'⚡',s:[
['🔋','التعريف والقياس',['**الطاقة** = قدرة الفرد على أداء العمل، مصدرها الغذاء. تُهمل لأنها غير ملموسة وصعبة القياس.','القياس: أكسجين مستهلك. **طاقة النشاط − طاقة الراحة = طاقة العمل.** الوحدة: **السعر الحراري الكبير**.']],
['💪','أنواع المجهود الخمسة',['**عقلي · بصري · يدوي · جذعي · مجهود الساقين.**','التصنيف (سعر/دقيقة): راحة 1 · خفيفة 1–2 · متوسطة 2–3 · شاقة 3–4 · مجهدة جداً أكثر من 4 (الدرج، الحديقة، رفع الأحمال).','عوامل الطاقة التسعة: وزن · نمو عضلي · وقت · موعد · سرعة · أدوات · تنظيم · حالة نفسية · خبرة.']],
['😮‍💨','التعب وعلاجه',['**حد التحمل:** 5 سعر/دقيقة للرجال و4 للسيدات.','**فسيولوجي:** عمل ساكن + تراكم **حامض اللاكتيك**. **سيكولوجي:** تعب **انعدام اللذة** (الملل) وتعب **الكبت** (التوتر).','العلاج: راحة ونوم للجسدي · تغيير العمل للملل · تجزئة العمل للكبت. الراحة تُؤخذ عند **بداية** التعب.']],
['🌱','الطاقة عبر الأطوار والتقييم',['بداية الزواج خفيف · الأطفال صغار يزداد · **تعليم الأطفال ذروة** · الجامعة · ترك الأبناء · الشيخوخة يقل الرصيد.','التخطيط: تبسيط · ارتباط بالوقت · توزيع الجهد والراحة. التقييم: أسئلة التعب والتوزيع والموازنة والتطوير.']],
['🔥','جدول استهلاك الطاقة (سعر لكل رطل/ساعة)',['**0.5:** جلوس للأكل أو القراءة أو التطريز · **1.0:** وقوف مريح · **1.5:** انحناء أو ركوع، كنس ومسح الأرض، غسل الشبابيك وتلميع المعادن · **2.0:** تلميع الأرضية، تنفيض السجاجيد، دعك الأرضية، ترتيب الأسرة، الانحناء لرفع شيء، هبوط الدرج · **3.5:** صعود الدرج.','أعمال سهلة ≤1 · متوسطة 1.5–2 · متعبة أكثر من 2.','الجلوس يزيد ٣٠٪ عن النوم، والوقوف ٣٨٪، **والمشي الأكثر استهلاكاً**. المشي السريع يستهلك مرة ونصف البطيء.','أمثلة التصنيف: خفيفة جلوس (حياكة، تقشير خضروات) · خفيفة وقوف (كي، خفق بيض، غسل أطباق، مكنسة كهربائية) · متوسطة (مشي، كنس، تعليق ملابس) · شاقة (مسح أرضيات، ورنيش، تغيير ملايات).']],
['❤️','تفضيلات ربات البيوت (دراسة ١٢٠ ربة بيت)',['التفضيل شخصي ولا يرتبط بالضرورة بقلة الجهد.','**المفضلة بالترتيب:** قيمة معنوية وفخر · أدوات وتقدير الأسرة · التحكم في الوقت والسرعة · جودة الخامات · ديمومة النتائج والإبداع · عمل غير متعب أو يشارك فيه الكبار.','**غير المفضلة:** نتائج مؤقتة · مشكلات زمنية · إجهاد جسدي · رتابة · غياب الإبداع.']],
['🧪','حقائق عن التعب',['معظم الأعمال المنزلية استهلاكها بسيط (صعود الدرج 20 مرة يعادل نصف برتقالة).','**حد التحمل (Endurance Limit):** أقصى استهلاك دون زيادة حامض اللاكتيك أو حرارة الجسم.','الأعراض: إرهاق، ضجر، آلام، كثرة أخطاء، قلة إنتاج، تغيرات كيميائية في الدم.','**العمل الساكن** (مثل إمساك إبرة التريكو) يضغط الأوعية ويقلل الدم للعضلة فيؤلم أسرع من المتحرك. المشي أقل إجهاداً من الوقوف الثابت.','تعب الملل: يزيد عند ذوي الذكاء المرتفع والمنطوين ويتأثر بالإضاءة والأصوات. تعب الكبت: تغيير الخطط فجأة، المقاطعة، عدم الثقة في النتائج، عقل مشغول بشيء آخر.','العضلات الصغيرة (الأصابع) تُشفى أسرع من الكبيرة (الأرجل). الراحة في المصانع 5–15 دقيقة مرتين يومياً.']],
['🪞','أسئلة التقييم الذاتي للطاقة',['١ توقيت التعب · ٢ الوعي بنوعه وعلاجه · ٣ توزيع الجهد · ٤ تقدير الراحة · ٥ الموازنة بين الطاقة والوقت والمال · ٦ التطوير.','التقييم أيضاً: فهم أسباب التعب، وأسباب الميل لعمل والنفور من آخر، وعدم استنزاف طاقة الشباب دون حساب للمستقبل.']]]}];
const X=[{t:'📝 بنك أسئلة ١',q:[
['أي مورد يُصنف ضمن الموارد البشرية؟',['الوقت والمال','القدرات والمهارات والميول','الممتلكات وتسهيلات المجتمع','الدخل المباشر'],1],
['ما سمة الوقت المميزة؟',['يمكن ادخاره','يتساوى فيه الجميع (24 ساعة)','يسهل تبديله بمورد آخر','يزيد بالجهد'],1],
['مستوى المعيشة هو:',['المال الشهري','الصورة العقلية لما يراه الفرد ضرورياً','عدد السلع المشتراة','الدخل − المصروفات'],1],
['الدخل من سلع وخدمات تُنتج داخل البيت دون مال:',['غير المباشر','المالي الصافي','المباشر','السيكولوجي'],2],
['الزيادة السكانية في مصر ناتجة كثيراً عن:',['نقص الوعي الصحي','الاعتقاد أن كثرة الأولاد قوة وسند','قلة فرص عمل المرأة','انخفاض المعيشة في المدن'],1],
['المرونة شرط في الميزانية من أجل:',['تقليل الدخل','مواجهة الظروف الطارئة','إلغاء الادخار الجبري','زيادة الثوابت'],1]]},
{t:'📝 بنك أسئلة ٢',q:[
['استغلال الخدمات المجانية للمجتمع عند عجز الموازنة وسيلة من وسائل:',['عجز الموازنة','زيادة الدخل','زيادة المصروفات','ضغط المصروفات'],3],
['استغلال مهارات أفراد الأسرة عند عدم الموازنة وسيلة من وسائل:',['عجز الموازنة','ضغط المصروفات','زيادة الدخل','زيادة المصروفات'],2],
['خطة توزيع الموارد المحدودة على الحاجات المتعددة هي:',['حاسة التوقيت','الميزانية','التنظيم','إدارة الموارد'],1],
['مورد الطاقة مورد:',['قابل للقياس','أكثر وضوحاً','غير ملموس'],2],
['المال من الموارد:',['المهارات','القدرات','غير البشرية'],2],
['الجهد الذي يستعمل العقل في أي عمل مهما كان بسيطاً:',['الجزعي','البدني','العقلي'],2]]}];
const m=document.getElementById('m'),nav=document.getElementById('nav');let cur=0;
const f=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const tabs=[...C.map(c=>c.i+' '+c.t.split(':')[0]),'🎯 الامتحانات'];
function go(n){cur=n;[...nav.children].forEach((b,i)=>b.classList.toggle('on',i==n));
 if(n<C.length){const c=C[n];m.innerHTML=`<div class="ch"><span style="font-size:34px">${c.i}</span>${c.t}</div>`+c.s.map((s,i)=>`<div class="card${i?'':' open'}"><h3 onclick="this.parentNode.classList.toggle('open')"><span class="ic">${s[0]}</span>${s[1]}<em>▾</em></h3><div class="bd"><ul>${s[2].map(p=>`<li>${f(p)}</li>`).join('')}</ul></div></div>`).join('');}
 else{let sc={};m.innerHTML=`<div class="ch"><span style="font-size:34px">🎯</span>الامتحانات (اضغط الإجابة)</div>`+X.map((e,a)=>`<h3>${e.t}</h3>`+e.q.map((q,b)=>`<div class="q" data-k="${a}${b}" data-a="${q[2]}"><p>${b+1}. ${q[0]}</p>${q[1].map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}</div>`).join('')).join('')+'<div class="sc" id="sc">النتيجة: 0</div>';
  m.querySelectorAll('.q').forEach(q=>q.onclick=e=>{const b=e.target.closest('button');if(!b||q.dataset.d)return;q.dataset.d=1;const a=+q.dataset.a,i=+b.dataset.i;q.children[a+1].classList.add('ok');if(i!=a)b.classList.add('no');sc[q.dataset.k]=i==a?1:0;document.getElementById('sc').textContent='النتيجة: '+Object.values(sc).reduce((x,y)=>x+y,0)+' / '+Object.keys(sc).length+' محلولة';});}
 scrollTo(0,0);}
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>go(i);nav.appendChild(b)});
addEventListener('scroll',()=>{document.getElementById('bar').style.width=(scrollY/(document.body.scrollHeight-innerHeight||1)*100)+'%'});
go(0);
